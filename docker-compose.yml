services:
  api:
    build:
      context: ./backend/Api
    environment:
      ASPNETCORE_URLS: http://+:8080
      # Windows Integrated Auth (used for local dev — see backend/Api/appsettings.json) isn't
      # available to a Linux container the same way, so the deployed app needs its own SQL login.
      # TODO Phase 0: get a SQL Server auth login provisioned on vm-trm-sql1 with SELECT on
      # Redingote.dbo.WorkdayDemographic and full DML on EmployeeLifecycle, then fill these in.
      ConnectionStrings__AppDb: "Server=${SQL_SERVER};Database=EmployeeLifecycle;User Id=${SQL_APP_USER};Password=${SQL_APP_PASSWORD};TrustServerCertificate=True;"
      ConnectionStrings__WorkdayDb: "Server=${SQL_SERVER};Database=Redingote;User Id=${SQL_APP_USER};Password=${SQL_APP_PASSWORD};TrustServerCertificate=True;"
      AzureAd__TenantId: "${AAD_TENANT_ID}"
      AzureAd__ClientId: "${AAD_API_CLIENT_ID}"
      AzureAd__Audience: "${AAD_API_CLIENT_ID}"
      AzureAd__ClientSecret: "${AAD_API_CLIENT_SECRET}"
      HrGroup__TrmRhAdmGroupId: "${TRM_RH_ADM_GROUP_ID}"
    volumes:
      - attachments:/app/attachments
    restart: unless-stopped

  web:
    build:
      context: .
      args:
        VITE_AAD_CLIENT_ID: "${AAD_SPA_CLIENT_ID}"
        VITE_AAD_TENANT_ID: "${AAD_TENANT_ID}"
        VITE_AAD_API_CLIENT_ID: "${AAD_API_CLIENT_ID}"
    ports:
      - "${WEB_PORT:-8443}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  attachments:
